name: Verify RestMan6 on Tomcat and MySQL
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAVEN_OPTS: -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Bangkok
      RESTMAN_DB_URL: jdbc:mysql://127.0.0.1:3307/restman6?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&connectionTimeZone=Asia/Bangkok&allowPublicKeyRetrieval=true&useSSL=false
      RESTMAN_DB_USER: restman6
      RESTMAN_DB_PASSWORD: RestmanDemo6!
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start Tomcat and MySQL
        run: |
          cp .env.example .env
          docker compose up -d --build
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/restman6/login >/dev/null; then ready=1; break; fi
            sleep 3
          done
          test "$ready" -eq 1
      - name: Java and MySQL integration tests
        run: |
          mkdir -p target-results
          set -o pipefail
          mvn -B -Pmysql-test test | tee target-results/mysql6.txt
      - name: HTTP tests through Tomcat
        run: |
          set -o pipefail
          python3 tools/http-test6.py http://localhost:8080/restman6 | tee target-results/http-tomcat6.txt
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p target-results
          docker compose logs --no-color > target-results/services6.txt
          docker compose ps > target-results/status6.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tomcat-mysql-test-results6
          path: target-results/
      - name: Stop demo services
        if: always()
        run: docker compose down -v
